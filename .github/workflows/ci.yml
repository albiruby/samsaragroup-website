name: CI

# Runs the same checks we rely on locally: install, lint, production audit,
# and build. No secrets: the site and the Sanity dataset are public-read.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SANITY_PROJECT_ID: p5zu5azj
      NEXT_PUBLIC_SANITY_DATASET: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security regression tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Audit Sanity for PII
        run: npm run audit:pii

      - name: Build
        run: npm run build

      - name: Start production server
        run: npm run start &

      - name: Wait for the server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000 > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "server did not start in time"
          exit 1

      - name: Link check
        run: npm run check:links
