name: CI

# Runs the same checks we rely on locally: install, lint, production audit,
# and build. No secrets: the site and the Sanity dataset are public-read.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build > build.log 2>&1

      - name: Show the build failure
        if: steps.build.outcome == 'failure'
        run: |
          echo "### Build failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 30 build.log | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            line="${line//$'\n'/'%0A'}"
            echo "::error title=Build log::$line"
          done
          exit 1
