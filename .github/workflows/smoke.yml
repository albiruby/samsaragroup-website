name: Production smoke

# Deep check against the live site: routes, SEO tags, security headers, sitemap,
# and the CMS-driven element counts. A failure opens (or comments on) an issue.
# The uptime workflow only checks HTTP 200; this catches pages that still answer
# 200 after falling back to hardcoded content.
on:
  schedule:
    - cron: "0 1 * * *" # 08:00 WIB
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run smoke
        id: smoke
        continue-on-error: true
        run: npm run smoke

      - name: Report the failure on an issue
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Production smoke check is failing";
            const body = [
              `Checked at ${new Date().toISOString()}`,
              "",
              "`npm run smoke` failed. See the workflow run:",
              "",
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");

            const open = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const existing = open.data.find((i) => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
              core.notice(`Commented on issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ ...context.repo, title, body });
              core.notice(`Opened issue #${created.data.number}`);
            }

      - name: Close the issue once it recovers
        if: steps.smoke.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Production smoke check is failing";
            const open = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of open.data.filter((i) => i.title === title)) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `Recovered: npm run smoke passed at ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: "closed",
              });
              core.notice(`Closed issue #${issue.number}`);
            }

      - name: Fail the job if smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
