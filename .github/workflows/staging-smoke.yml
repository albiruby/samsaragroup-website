name: Staging preview smoke

# Guards the editor-facing staging URL. It must stay public, noindex, and read
# the staging dataset, while production must stay on the production dataset.
on:
  schedule:
    - cron: "0 2 * * *" # 09:00 WIB
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: staging-preview-smoke
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check staging and production separation
        id: check
        run: |
          set -uo pipefail
          STAGING="https://samsaragroup-git-staging-janalbireo123-3375s-projects.vercel.app"
          PROD="https://samsaragroup.vercel.app"
          FAILED=""

          code=$(curl -s -o /tmp/staging.html -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 3 "$STAGING/" || echo "000")
          printf '%-4s %s\n' "$code" "$STAGING/"
          if [ "$code" != "200" ]; then
            FAILED="${FAILED}- staging root returned HTTP $code"$'\n'
          fi

          headers=$(curl -sI --max-time 30 --retry 2 --retry-delay 3 "$STAGING/" || true)
          if ! printf '%s' "$headers" | grep -qi '^x-robots-tag:.*noindex'; then
            FAILED="${FAILED}- staging is missing x-robots-tag: noindex"$'\n'
          fi

          if ! grep -q '>Staging<' /tmp/staging.html; then
            FAILED="${FAILED}- staging page is missing the STAGING badge"$'\n'
          fi
          if ! grep -q '/staging/' /tmp/staging.html; then
            FAILED="${FAILED}- staging page does not reference the staging dataset CDN"$'\n'
          fi

          robots=$(curl -s --max-time 20 --retry 2 --retry-delay 3 "$STAGING/robots.txt" || true)
          if ! printf '%s' "$robots" | grep -q 'Disallow: /'; then
            FAILED="${FAILED}- staging robots.txt does not disallow crawling"$'\n'
          fi

          code=$(curl -s -o /tmp/prod.html -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 3 "$PROD/events" || echo "000")
          printf '%-4s %s\n' "$code" "$PROD/events"
          if [ "$code" != "200" ]; then
            FAILED="${FAILED}- production /events returned HTTP $code"$'\n'
          fi
          if grep -q '/staging/' /tmp/prod.html; then
            FAILED="${FAILED}- production is serving staging dataset images"$'\n'
          fi
          if grep -q '>Staging<' /tmp/prod.html; then
            FAILED="${FAILED}- production is serving the STAGING badge"$'\n'
          fi

          if [ -n "$FAILED" ]; then
            echo "failed=1" >> "$GITHUB_OUTPUT"
            DELIM="EOF_$(date +%s%N)"
            {
              echo "FAILED_PATHS<<$DELIM"
              printf '%s' "$FAILED"
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"
            echo "::error::Staging preview smoke failed"
          else
            echo "failed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Report the failure on an issue
        if: steps.check.outputs.failed == '1'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          FAILED_PATHS: ${{ steps.check.outputs.FAILED_PATHS }}
        with:
          script: |
            const title = "Staging preview smoke is failing";
            const detail = (process.env.FAILED_PATHS || "(no details captured)")
              .replace(/`/g, "'")
              .slice(0, 4000);
            const body = [
              `Checked at ${new Date().toISOString()}`,
              "",
              "Staging preview guard failed:",
              "",
              "```text",
              detail,
              "```",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");

            const open = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const existing = open.data.find((i) => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }

      - name: Fail the job if the guard failed
        if: steps.check.outputs.failed == '1'
        run: exit 1
